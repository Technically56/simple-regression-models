[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-regression-models"
version = "0.1.0"
description = "Linear and logistic regression training and evaluation on EMBER 2018"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "psutil>=5.9",
    "threadpoolctl>=3.2",
    "tqdm>=4.66",
    "pandas>=2.1",
    "streamlit>=1.32",
]

[project.optional-dependencies]
ember = [
    "ember @ git+https://github.com/elastic/ember.git@d97a0b523de02f3fe5ea6089d080abacab6ee931",
    "lief>=0.9",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
]
gpu = ["cupy-cuda12x>=13"]

[project.scripts]
regression-benchmark = "main:main"

[tool.setuptools]
py-modules = ["main", "app"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "base*", "benchmark*", "dataset*", "models*", "training*"]
namespaces = false

[tool.pyright]
reportMissingTypeStubs = false
